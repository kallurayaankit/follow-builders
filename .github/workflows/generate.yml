name: Generate Feeds  on:    schedule:      - cron: '0 6 * * *'    workflow_dispatch:  jobs:    generate:      runs-on: ubuntu-latest      steps:        - uses: actions/checkout@v4        - uses: actions/setup-node@v4          with:            node-version: 20        - run: npm ci        - name: Generate feeds          run: node scripts/generate-feed.js        - name: Commit and push feeds          run: |            git config user.name "github-actions[bot]"            git config user.email "github-actions[bot]@users.noreply.github.com"            git add feed-blogs.json            git diff --staged --quiet || git commit -m "Update feeds [skip ci]"            git push 
